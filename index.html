 const k=b.dataset.fav,i=FV.indexOf(k),add=i<0;if(add)FV.push(k);else FV.splice(i,1);favSave();

 favBadge(true);toast(add?"Added to Favorite ❤":"Removed from Favorite");

});

 "/privacy":()=>LG("Privacy Policy","Privacy",[
  ["1. Overview",`<p>This Privacy Policy explains what information <b>Developer Robin</b> (“I”, “me”, “this website”) collects when you visit this portfolio website, browse my projects, download free resources, watch demo videos, create an account or send me a message — and how that information is used.</p><p>By using this website you agree to the practices described here. If you do not agree, please do not use the site.</p>`],
  ["2. Information I collect",`<ul><li><b>Account details.</b> When you sign up or log in with email or Google, I receive your name and email address. Passwords are handled securely by Firebase Authentication — I never see or store your password in plain text. I also keep basic account details: when the account was created, your last login time, whether your email is verified and which sign-in method you used.</li><li><b>Contact form.</b> If you send me a message, I receive the name, email address, subject, project type (optional) and message you write, together with the time it was sent. The form is only sent after you tick the consent box.</li><li><b>Password reset requests.</b> If you request a password reset, the email address you enter is used to send you the reset link, and a short note about the request is added to my inbox.</li><li><b>Favorites.</b> Projects, free resources and videos you save as Favorite are stored in your own browser (on your device) and are linked to your account on that browser. They are not sent to my servers.</li><li><b>Preferences &amp; speed-ups.</b> Your light/dark theme choice, a saved copy of recently loaded site content (so pages open faster next time), a sign-in hint, and the time of your last message or reset request (to prevent spam) are kept in your browser storage.</li></ul>`],
  ["3. How I use your information",`<ul><li>To create and manage your account and let you log in, save favorites and download free projects.</li><li>To read and reply to your messages and project enquiries.</li><li>To send account emails such as email verification and password-reset links.</li><li>To keep the website secure, prevent spam and abuse, and make it work properly.</li></ul><p>I do not use your information for advertising, and I do not build marketing profiles about you.</p>`],
  ["4. Cookies &amp; browser storage",`<p>This website does not use advertising or analytics trackers. It does not set its own tracking cookies. It uses your browser’s local storage (and the storage used by Firebase Authentication) only for the purposes listed in section 2, such as keeping you logged in, remembering your theme and saving your favorites. You can clear this data at any time from your browser settings; doing so may log you out and remove your saved favorites.</p>`],
  ["5. Third-party services",`<p>To run the website I rely on the following services, which may process limited technical data (such as your IP address) when you use them:</p><ul><li><b>Google Firebase</b> (Authentication and Firestore database) — to manage accounts, store contact messages and publish the site’s content.</li><li><b>Google Sign-In</b> — if you choose “Continue with Google”.</li><li><b>Google Fonts</b> — to load the Poppins font.</li><li><b>Simple Icons CDN</b> — to display technology icons.</li><li><b>YouTube</b> (privacy-enhanced youtube-nocookie.com) — only when you open a demo video.</li><li><b>External image and download hosts</b> — thumbnails and some free downloads may be hosted on other services; their own privacy policies apply once you visit them.</li></ul><p>This website may also link to my social profiles and other websites. I am not responsible for the privacy practices of those sites.</p>`],
  ["6. Sharing of information",`<p>I do not sell, rent or trade your personal information. It is shared only with the service providers listed above (so the website can function), or if I am required to do so by law or to protect the website and its users from abuse.</p>`],
  ["7. Data retention &amp; your choices",`<p>Account details are kept while your account exists. Contact messages are kept for as long as needed to reply and keep a record of the conversation. You may at any time ask me to access, correct or delete the information I hold about you (including your account and any messages you sent) — just ${ctl()}. You can also log out, clear your browser data or stop using the site whenever you like.</p>`],
  ["8. Security",`<p>Accounts and data are protected by Firebase security features and encrypted (HTTPS) connections. I take reasonable steps to keep your information safe, but no website or internet service can be guaranteed to be 100% secure, so please choose a strong, unique password and keep it private.</p>`],
  ["9. Children’s privacy",`<p>This website is not intended for children under 13 and I do not knowingly collect personal information from them. If you believe a child has provided personal information, please ${ctl()} and I will remove it.</p>`],
  ["10. Changes to this policy",`<p>I may update this Privacy Policy from time to time. The “Last updated” date at the top shows when it was last changed. Continued use of the website after an update means you accept the new version.</p>`],
  ["11. Contact",`<p>Questions about this policy or your data? Please ${ctl()}.</p>`]
 ]),

  const mk=(sel,fn)=>{let cur=null;addEventListener("mousemove",e=>{const el=e.target.closest?.(sel);if(el!==cur){if(cur){const o=cur;o.style.transition="transform .5s cubic-bezier(.2,.8,.2,1)";o.style.transform="";setTimeout(()=>{if(o!==cur)o.style.transition=""},520)}cur=el}if(el)fn(el,e)},{passive:true})};
  mk(".card,.portrait",(el,e)=>{if(el.classList.contains("rv")&&!el.classList.contains("in"))return;const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;el.style.setProperty("--mx",px*100+"%");el.style.setProperty("--my",py*100+"%");el.style.transition="transform .12s";el.style.transform=`perspective(900px) rotateX(${(.5-py)*8}deg) rotateY(${(px-.5)*10}deg) translateY(${el.classList.contains("card")?-6:0}px)`});
  mk(".btn.p",(el,e)=>{const r=el.getBoundingClientRect();el.style.transition="transform .15s";el.style.transform=`translate(${((e.clientX-r.left)/r.width-.5)*10}px,${((e.clientY-r.top)/r.height-.5)*8}px)`});
 }
}
chrome();route();initFb();
</script>

  match /projects/{id}      { allow read: if resource.data.published == true || isAdmin(); allow write: if isAdmin(); }

  }
  match /users/{uid} {
    allow create, update: if request.auth != null && request.auth.uid == uid
      && request.resource.data.keys().hasOnly(['name','email','createdAt','lastLogin','verified','provider']);
    allow read: if request.auth != null && (request.auth.uid == uid || isAdmin());
    allow delete: if isAdmin();

 }
}`;

 if(!/^image\/(png|jpe?g|webp|gif|avif)$/.test(file.type))throw new Error("Only PNG, JPG, WebP, GIF or AVIF images are allowed.");
 if(file.size>5*1024*1024)throw new Error("Image is larger than 5 MB.");
 const fd=new FormData();fd.append("file",file);fd.append("fileName",file.name.replace(/[^\w.-]/g,"_"));fd.append("folder",k.folder);fd.append("useUniqueFileName","true");
 let r;try{r=await fetch("https://upload.imagekit.io/api/v1/files/upload",{method:"POST",headers:{Authorization:"Basic "+btoa(k.priv+":")},body:fd})}
 catch{throw new Error("Request failed: network error or blocked by the browser (CORS). Check your internet and key.")}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.message||"ImageKit upload failed ("+r.status+")");
 return j.url}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-up]");if(!b)return;
 const inp=b.closest("form").elements[b.dataset.up],f=document.createElement("input");f.type="file";f.accept="image/*";
 f.onchange=async()=>{if(!f.files[0])return;b.disabled=1;b.textContent="আপলোড হচ্ছে…";
  try{inp.value=await ikUpload(f.files[0]);inp.dispatchEvent(new Event("input",{bubbles:true}));await log("upload","imagekit");toast("Uploaded ✓ URL filled in")}catch(x){toast(x.message,1)}
  b.disabled=0;b.textContent="📤 ছবি আপলোড (ImageKit)"};f.click()});
document.addEventListener("input",e=>{const t=e.target;if(t.name&&IMGK.test(t.name)){const p=t.closest("label")?.querySelector(".pv");if(p){p.hidden=!t.value;p.src=t.value}}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-pr]");if(!b)return;const f=b.closest("form"),p=JSON.parse(b.dataset.pr);for(const k in p){const el=f.elements[k];if(!el)continue;if(el.type==="checkbox")el.checked=!!p[k];else el.value=p[k]}toast("রঙ বসানো হয়েছে — নিচে সেভ করুন")});
const syncP=w=>{w.querySelector("input[type=hidden]").value=[...w.querySelectorAll(".pr")].map(r=>r.querySelector(".pn").value.trim().replace(/\|/g,"/")+"|"+r.querySelector(".prg").value).filter(l=>!l.startsWith("|")).join("\n")};
document.addEventListener("input",e=>{const w=e.target.closest?.(".pw");if(!w)return;if(e.target.classList.contains("prg"))e.target.parentNode.querySelector(".pvl").textContent=e.target.value+"%";syncP(w)});
document.addEventListener("click",e=>{const ad=e.target.closest("[data-pa]"),de=e.target.closest("[data-pd]");if(ad){const w=ad.closest(".pw"),rs=w.querySelector(".rows");rs.insertAdjacentHTML("beforeend",prow());rs.lastElementChild.querySelector(".pn").focus();syncP(w)}if(de){const w=de.closest(".pw");de.closest(".pr").remove();syncP(w)}});
function ikV(v){const k=ikGet();
 v.innerHTML=`<div class="ph"><h2>🖼️ ছবি আপলোড (ImageKit)</h2><p>একবার কী সেট করলে প্রতিটি “ছবি আপলোড” বাটন কাজ করবে।</p></div><div class="card" style="margin-bottom:16px"><b>কীভাবে ব্যবহার করবেন</b><ol style="margin:8px 0 0 20px;line-height:1.8"><li>ImageKit.io তে লগইন করে Developer options থেকে Public key, Private key ও URL endpoint কপি করুন।</li><li>নিচের ফর্মে বসিয়ে <b>Save</b> চাপুন।</li><li>লোগো, মেইন ফোটো বা প্রজেক্টের ছবির ঘরে <b>📤 ছবি আপলোড</b> চাপলেই ছবি আপলোড হয়ে লিংক নিজে বসে যাবে।</li></ol></div>
 <div class="card" style="margin-bottom:16px"><p style="color:#f59e0b"><b>Security notice:</b> the private key gives full control of your ImageKit account. Here it is kept only in <i>this browser</i> (this session by default) and is never written to Firestore, the public site, or this file. Anyone with access to this browser profile can read it, so use a trusted personal device only. For production-grade security, signing uploads on a server is the recommended approach.</p></div>
 <form class="card" id="ik"><div class="fg">
 <label>Public key<input name="pub" value="${esc(k.pub)}" placeholder="public_xxxxxxxx" maxlength="200"></label>
 <label>URL endpoint<input name="ep" value="${esc(k.ep)}" placeholder="https://ik.imagekit.io/your_id" maxlength="200"></label>
 <label>Private key ${k.priv?"(saved — enter a new one to replace)":""}<input name="priv" type="password" autocomplete="off" placeholder="${k.priv?"••••••••••••":"private_xxxxxxxx"}" maxlength="200"></label>
 <label>Upload folder<input name="folder" value="${esc(k.folder)}" maxlength="100"></label>
 <label class="w" style="grid-template-columns:auto 1fr;align-items:center"><input type="checkbox" name="rem" style="width:auto" ${k.remembered?"checked":""}>Remember private key on this device (otherwise it is forgotten when you close the tab)</label>
 </div><p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn p">Save</button><button type="button" class="btn" id="tk">Test connection</button><button type="button" class="btn d" id="rk">Remove private key</button></p><p class="mu" id="tr" style="margin-top:10px">Not verified yet.</p></form>
 <div class="card" style="margin-top:16px"><h3>Upload image</h3><p class="mu" style="margin:6px 0 10px">PNG, JPG, WebP, GIF or AVIF, up to 5 MB.</p><input type="file" id="uf" accept="image/*"><p id="ur" style="margin-top:10px;word-break:break-all"></p></div>`;
 $("#ik").onsubmit=e=>{e.preventDefault();const f=e.target.elements,pub=f.pub.value.trim(),ep=f.ep.value.trim().replace(/\/$/,""),folder=f.folder.value.trim(),pk=f.priv.value.trim();
  try{if(ep&&!/^https:\/\/ik\.imagekit\.io\/[\w-]+$/.test(ep)&&!/^https:\/\/[\w.-]+$/.test(ep))throw new Error("URL endpoint must be an https URL like https://ik.imagekit.io/your_id");
   if(!/^\/[\w\/-]*$/.test(folder))throw new Error("Folder must start with / and contain only letters, numbers, - _ /");
   if(pk&&!/^private_[\w+\/=-]+$/.test(pk))throw new Error("Private key looks wrong (should start with private_).");
   localStorage.ikpub=pub;localStorage.ikep=ep;localStorage.ikfolder=folder;
   if(pk){if(f.rem.checked){localStorage.ikpriv=pk;sessionStorage.removeItem("ikpriv")}else{sessionStorage.ikpriv=pk;localStorage.removeItem("ikpriv")}}
   else if(!f.rem.checked){const c=localStorage.ikpriv;if(c){sessionStorage.ikpriv=c;localStorage.removeItem("ikpriv")}}
   log("update","imagekit-settings");toast("Saved in this browser ✓ (not verified until you test)");ikV(v)}catch(x){toast(x.message,1)}};
 $("#rk").onclick=()=>{localStorage.removeItem("ikpriv");sessionStorage.removeItem("ikpriv");toast("Private key removed");ikV(v)};
 $("#tk").onclick=async()=>{const p=ikGet().priv,t=$("#tr");if(!p){t.textContent="Enter and save a private key first.";return}
  t.textContent="Testing…";
  try{const r=await fetch("https://api.imagekit.io/v1/files?limit=1",{headers:{Authorization:"Basic "+btoa(p+":")}});
   t.textContent=r.ok?"✓ ImageKit accepted the key (checked "+new Date().toLocaleTimeString()+").":r.status===401?"✗ ImageKit rejected the key (401). Check the private key.":"✗ ImageKit returned status "+r.status+".";
  }catch{t.textContent="Could not verify: the request failed (network, or blocked by the browser's CORS policy). This does not prove the key is wrong — try an upload below."}};
 $("#uf").onchange=async e=>{const f=e.target.files[0],o=$("#ur");if(!f)return;o.textContent="Uploading…";
  try{const url=await ikUpload(f);await log("upload","imagekit");o.innerHTML=`✓ Uploaded: <a href="${esc(url)}" target="_blank" rel="noopener" style="color:#06b6d4">${esc(url)}</a> <button class="btn" id="cu">Copy URL</button>`;$("#cu").onclick=()=>navigator.clipboard.writeText(url).then(()=>toast("Copied"),()=>toast("Copy failed",1))}
  catch(x){o.textContent="✗ "+x.message}}}
</script></body></html>
